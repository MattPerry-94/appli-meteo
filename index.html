<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Météo" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Prévisions météo à 7 jours issues du consensus AROME, GFS et ECMWF, avec les vigilances Météo-France et un radar des pluies."
    />
    <meta name="theme-color" content="#f6f8fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070a12" media="(prefers-color-scheme: dark)" />
    <title>Appli Météo</title>
    <script>
      // Pose le thème avant le premier rendu, pour éviter le flash blanc en
      // mode sombre. Même logique que src/hooks/useTheme.ts.
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
        } catch (e) {}
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
